spring.application.name=Hackathon
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/Hackathon?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456$

#config JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

#Config logging
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - %-5level - %logger{50} - %msg%n
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=30

logging.level.root=INFO
logging.level.com.example.hackathon.repository=WARN
logging.level.com.example.hackathon.service=INFO
logging.level.com.example.hackathon.controller=INFO

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

